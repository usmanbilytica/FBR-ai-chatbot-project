name: CI

# Runs on every push to main, on every pull request, and on demand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"   # matches requires-python and the Dockerfile

jobs:
  # ---------------------------------------------------------------- lint
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip ruff
      # Rules live in [tool.ruff] in pyproject.toml.
      - run: ruff check --output-format=github .

  # ---------------------------------------------------------------- tests
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30

    # Placeholder settings so app.core.config loads in CI. These are NOT real
    # credentials: unit tests mock the LLM and never touch the HRMS/OCR
    # databases. Tests marked @pytest.mark.integration (live DBs) are skipped.
    env:
      ENVIRONMENT: production
      HRMS_DB_SERVER: ci-placeholder
      HRMS_DB_NAME: FBR_HRMS
      HRMS_DB_USER: ci
      HRMS_DB_PASSWORD: ci-placeholder
      OCR_DB_SERVER: ci-placeholder
      OCR_DB_NAME: FBR_OCR_GROUPED
      OCR_DB_USER: ci
      OCR_DB_PASSWORD: ci-placeholder
      LLM_API_KEY: ci-placeholder-not-a-real-key
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # pyodbc needs the unixODBC driver manager to import.
      - name: Install system packages
        run: sudo apt-get update -q && sudo apt-get install -y -q unixodbc

      # Install CPU-only PyTorch first so sentence-transformers doesn't pull
      # the multi-GB CUDA build. Then the project's own requirements.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Check every file compiles
        run: python -m compileall -q app scripts tests

      - name: Run unit tests
        run: pytest -m "not integration" -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------- frontend
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------- docker
  # Builds the image to prove the Dockerfile works. Nothing is pushed.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fbr-ai-chatbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
