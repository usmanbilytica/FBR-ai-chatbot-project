name: CI

# Runs on every push to main, on every pull request, and on demand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      # Uses your ruff config (ruff.toml, .ruff.toml or [tool.ruff] in
      # pyproject.toml) if you add one. Otherwise it checks only real errors
      # (syntax errors, undefined names, unused imports/variables), not style.
      - name: Ruff check
        run: |
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || { [ -f pyproject.toml ] && grep -q '^\[tool\.ruff' pyproject.toml; }; then
            ruff check --output-format=github .
          else
            ruff check --output-format=github --select E4,E7,E9,F .
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Tests should not call real AI APIs. If some of yours need a key,
    # add it under Settings → Secrets and variables → Actions, and it will
    # be passed through here (an unset secret is just an empty string).
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: pip-${{ runner.os }}-py${{ matrix.python-version }}-

      # Works with whichever layout the project uses: requirements.txt,
      # requirements-dev.txt, an installable pyproject.toml / setup.py, or none.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          for f in requirements-dev.txt dev-requirements.txt requirements-test.txt; do
            if [ -f "$f" ]; then pip install -r "$f"; fi
          done
          if [ -f setup.py ] || { [ -f pyproject.toml ] && grep -q '^\[build-system\]\|^\[project\]' pyproject.toml; }; then
            pip install -e .
          fi
          pip install pytest pytest-cov

      - name: Check every file compiles
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv|env|node_modules)/' .

      # pytest exits with code 5 when it finds no tests. Treat that as a
      # warning (so CI is green until tests exist) but fail on real failures.
      - name: Run tests
        run: |
          set +e
          pytest -v --cov=. --cov-report=term-missing --cov-report=xml
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::warning title=No tests found::Add test files (tests/test_*.py) so CI can check your code."
            exit 0
          fi
          exit "$code"

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
